<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">진행 순서</title>
  <desc id="d">처음 한 번: 1 가게 조사, 2 목표·전략. 그다음 매주 반복: 3 이번 주 주제 찾기, 4 레퍼런스 기획, 5 블로그·카드뉴스·숏폼 제작, 6 업종 법규 검수, 7 업로드(네이버·틱톡은 붙여넣기 묶음), 8 반응 측정과 4주마다 회고 뒤 다음 주로 돌아가요.</desc>
  <style>
    .ko{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
    .flow{stroke-dasharray:2 10;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .st{animation:on 12s ease-out infinite both}
    .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 12s ease-out infinite both}
    .s1{animation-delay:1.2s}.s2{animation-delay:2.4s}.s3{animation-delay:3.6s}.s4{animation-delay:4.8s}
    .s5{animation-delay:6s}.s6{animation-delay:7.2s}.s7{animation-delay:8.4s}
    @keyframes on{0%{opacity:.35}4%,80%{opacity:1}90%,100%{opacity:.35}}
    @keyframes ring{0%{transform:scale(.8);opacity:.8}10%,100%{transform:scale(1.9);opacity:0}}
    @media (prefers-reduced-motion:reduce){.flow,.st,.ring{animation:none}.ring{opacity:0}}
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="470" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10282B"/>
      <stop offset="1" stop-color="#163538"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="470" fill="url(#bg)"/>

    <!-- 처음 한 번 -->
    <text x="72" y="52" class="ko" font-size="15" font-weight="700" letter-spacing="2" fill="#FF7A59">처음 한 번</text>
    <g stroke="#FF7A59" stroke-width="3" stroke-linecap="round" fill="none">
      <line class="flow" x1="100" y1="128" x2="100" y2="160"/>
      <line class="flow" x1="100" y1="222" x2="100" y2="282"/>
    </g>
    <g fill="#FF7A59">
      <path d="M93 152 l7 10 l7 -10 z"/>
      <path d="M93 274 l7 10 l7 -10 z"/>
    </g>

    <circle class="ring s0" cx="100" cy="98" r="26" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s0"><circle cx="100" cy="98" r="26" fill="#FF7A59"/>
    <text x="100" y="107" text-anchor="middle" class="ko" font-size="23" font-weight="800" fill="#10282B">1</text></g>
    <text x="146" y="95" class="ko" font-size="22" font-weight="700" fill="#FFF6EA">가게 조사</text>
    <text x="146" y="121" class="ko" font-size="16" fill="#A7C4BE">플레이스·리뷰·경쟁 가게를 먼저 보고, 확인만 받아요</text>

    <circle class="ring s1" cx="100" cy="192" r="26" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s1"><circle cx="100" cy="192" r="26" fill="#FF7A59"/>
    <text x="100" y="201" text-anchor="middle" class="ko" font-size="23" font-weight="800" fill="#10282B">2</text></g>
    <text x="146" y="189" class="ko" font-size="22" font-weight="700" fill="#FFF6EA">목표·전략</text>
    <text x="146" y="215" class="ko" font-size="16" fill="#A7C4BE">볼 숫자·힘줄 곳·첫 4주 계획 → 브랜드 프로필</text>

    <!-- 약속 -->
    <rect x="740" y="38" width="468" height="176" rx="18" fill="#0D2224" stroke="#2A5E61" stroke-width="1.5"/>
    <text x="768" y="72" class="ko" font-size="15" font-weight="700" letter-spacing="2" fill="#8EE3C8">늘 지키는 것</text>
    <g class="ko" font-size="17" fill="#FFF6EA">
      <path d="M770 98 l6 6 l11 -12" fill="none" stroke="#8EE3C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="798" y="104">조사로 알 수 있는 건 묻지 않아요 (질문 10개 이하)</text>
      <path d="M770 136 l6 6 l11 -12" fill="none" stroke="#8EE3C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="798" y="142">가격·후기·효능은 지어내지 않아요</text>
      <path d="M770 174 l6 6 l11 -12" fill="none" stroke="#8EE3C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="798" y="180">법규 검수를 통과해야 내보내요</text>
    </g>

    <!-- 매주 반복: 되돌아오는 선 -->
    <path class="flow" d="M1172 286 V258 H100" fill="none" stroke="#8EE3C8" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <rect x="480" y="244" width="320" height="28" rx="14" fill="#133033"/>
    <text x="640" y="264" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE"><tspan fill="#8EE3C8" font-weight="700">매주 반복</tspan>  ·  월요일에 "이번 주"라고 보내면 시작</text>

    <!-- 줄 잇는 선 -->
    <g stroke="#FF7A59" stroke-width="3" stroke-linecap="round" fill="none">
      <line class="flow" x1="134" y1="314" x2="290" y2="314"/>
      <line class="flow" x1="346" y1="314" x2="502" y2="314"/>
      <line class="flow" x1="558" y1="314" x2="714" y2="314"/>
      <line class="flow" x1="770" y1="314" x2="926" y2="314"/>
      <line class="flow" x1="982" y1="314" x2="1138" y2="314"/>
    </g>
    <g fill="#FF7A59">
      <path d="M288 307 l10 7 l-10 7 z"/>
      <path d="M500 307 l10 7 l-10 7 z"/>
      <path d="M712 307 l10 7 l-10 7 z"/>
      <path d="M924 307 l10 7 l-10 7 z"/>
      <path d="M1136 307 l10 7 l-10 7 z"/>
    </g>

    <!-- 3 -->
    <circle class="ring s2" cx="100" cy="314" r="28" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s2"><circle cx="100" cy="314" r="28" fill="#FF7A59"/>
    <text x="100" y="323" text-anchor="middle" class="ko" font-size="24" font-weight="800" fill="#10282B">3</text></g>
    <text x="100" y="376" text-anchor="middle" class="ko" font-size="20" font-weight="700" fill="#FFF6EA">이번 주 주제 찾기</text>
    <text x="100" y="402" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">손님 말·시즌·검색 수요</text>
    <text x="100" y="424" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">→ 근거 있는 후보 3개</text>

    <!-- 4 -->
    <circle class="ring s3" cx="324" cy="314" r="28" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s3"><circle cx="324" cy="314" r="28" fill="#FF7A59"/>
    <text x="324" y="323" text-anchor="middle" class="ko" font-size="24" font-weight="800" fill="#10282B">4</text></g>
    <text x="324" y="376" text-anchor="middle" class="ko" font-size="20" font-weight="700" fill="#FFF6EA">레퍼런스 기획</text>
    <text x="324" y="402" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">잘된 곳은 구조만 빌리고</text>
    <text x="324" y="424" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">문장·사진은 우리 것으로</text>

    <!-- 5 -->
    <circle class="ring s4" cx="536" cy="314" r="28" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s4"><circle cx="536" cy="314" r="28" fill="#FF7A59"/>
    <text x="536" y="323" text-anchor="middle" class="ko" font-size="24" font-weight="800" fill="#10282B">5</text></g>
    <text x="536" y="376" text-anchor="middle" class="ko" font-size="20" font-weight="700" fill="#FFF6EA">제작</text>
    <text x="536" y="402" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">블로그·카드뉴스·숏폼</text>
    <text x="536" y="424" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">우리 가게 색·말투 그대로</text>

    <!-- 6 -->
    <circle class="ring s5" cx="748" cy="314" r="28" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s5"><circle cx="748" cy="314" r="28" fill="#FF7A59"/>
    <text x="748" y="323" text-anchor="middle" class="ko" font-size="24" font-weight="800" fill="#10282B">6</text></g>
    <text x="748" y="376" text-anchor="middle" class="ko" font-size="20" font-weight="700" fill="#FFF6EA">검수 (법규)</text>
    <text x="748" y="402" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">업종 광고 규칙 19가지</text>
    <text x="748" y="424" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">가격·영업시간 사실 확인</text>

    <!-- 7 -->
    <circle class="ring s6" cx="960" cy="314" r="28" fill="none" stroke="#FF7A59" stroke-width="2"/>
    <g class="st s6"><circle cx="960" cy="314" r="28" fill="#FF7A59"/>
    <text x="960" y="323" text-anchor="middle" class="ko" font-size="24" font-weight="800" fill="#10282B">7</text></g>
    <text x="960" y="376" text-anchor="middle" class="ko" font-size="20" font-weight="700" fill="#FFF6EA">업로드</text>
    <text x="960" y="402" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">유튜브·인스타는 공식 API</text>
    <text x="960" y="424" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">네이버·틱톡은 붙여넣기 묶음</text>

    <!-- 8 -->
    <circle class="ring s7" cx="1172" cy="314" r="28" fill="none" stroke="#8EE3C8" stroke-width="2"/>
    <g class="st s7"><circle cx="1172" cy="314" r="28" fill="#163538" stroke="#8EE3C8" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="1172" y="323" text-anchor="middle" class="ko" font-size="24" font-weight="800" fill="#8EE3C8">8</text></g>
    <text x="1172" y="376" text-anchor="middle" class="ko" font-size="20" font-weight="700" fill="#FFF6EA">측정·다음 달</text>
    <text x="1172" y="402" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">반응을 기록하고</text>
    <text x="1172" y="424" text-anchor="middle" class="ko" font-size="15" fill="#A7C4BE">4주마다 계획 고치기</text>
  </g>
</svg>
