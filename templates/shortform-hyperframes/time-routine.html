<!doctype html>
<!-- kr-marketing-skill 숏폼 템플릿: 시간 자막 루틴(T6 오늘 하루·T5 만드는 과정). 훅 → 시각 장면 4개 → 가격·행동 (HyperFrames). guides/make/shortform-hyperframes.md 참고.
     [대괄호]는 사장님 자료로 채운다. 없으면 장면을 빼고 시간을 당긴다(지어내지 않음). 그림은 assets/art/, 사진은 assets/photo/. -->

<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 600; src: url("assets/fonts/Pretendard-SemiBold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.otf"); }
      /* 브랜드 팔레트 (카드뉴스 brand.colors와 같게) */
      :root {
        --bg: #fbf6ee; /* [브랜드 bg] */
        --main: #6b3e26; /* [브랜드 main] */
        --accent: #e9b44c; /* [브랜드 accent] */
        --ink: #1f1a17;
        --paper: #ffffff;
        --font: "Pretendard", sans-serif;
        /* 안전 영역: 위 14%(270) · 아래 35%(1250 아래 비움) · 왼쪽 65 · 오른쪽 190 */
        --safe-l: 120px;
        --safe-w: 770px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .hl { position: relative; z-index: 0; isolation: isolate; white-space: nowrap; }
      .hl::before { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0.04em; height: 0.42em; background: var(--accent); z-index: -1; transform-origin: 0 50%; transform: scaleX(var(--hl, 1)); border-radius: 4px; }

      /* 훅 */
      #s0-art { position: absolute; inset: -40px; }
      #s0-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 70%; }
      #s0-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(74,40,22,.96) 0%, rgba(74,40,22,.88) 30%, rgba(74,40,22,0) 52%); }
      #s0-tag { position: absolute; left: var(--safe-l); top: 300px; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 40px; padding: 10px 22px; border-radius: 40px; }
      #s0-lines { position: absolute; left: var(--safe-l); top: 392px; width: var(--safe-w); color: #fff; font-weight: 900; font-size: 116px; line-height: 1.16; letter-spacing: -0.035em; }
      .w { display: inline-block; }
      #s0-lines .gold { color: var(--accent); }

      /* 고정 제목 (레퍼런스: 위쪽 고정 제목 상자 2줄) */
      #fixed { position: absolute; left: 120px; width: 770px; top: 288px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 20; }
      #fixed span { display: inline-block; font-weight: 800; font-size: 60px; line-height: 1; padding: 14px 22px; letter-spacing: -0.03em; }
      #fixed-1 { background: var(--paper); color: var(--ink); }
      #fixed-2 { background: var(--main); color: #fff; }

      /* 루틴 장면 공통 */
      .art { position: absolute; left: 0; top: 470px; width: 1080px; height: 1130px; overflow: hidden; }
      .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(251,246,238,1) 0%, rgba(251,246,238,0) 14%, rgba(251,246,238,0) 86%, rgba(251,246,238,1) 100%); }
      .time { position: absolute; left: var(--safe-l); top: 560px; display: flex; align-items: center; gap: 18px; z-index: 5; }
      .time b { font-weight: 900; font-size: 128px; letter-spacing: -0.04em; color: var(--main); line-height: 1; text-shadow: 0 4px 0 rgba(255,255,255,.7); }
      .time i { font-style: normal; font-weight: 800; font-size: 44px; background: var(--main); color: #fff; padding: 10px 20px; border-radius: 12px; }
      .chip { position: absolute; left: var(--safe-l); top: 560px; font-weight: 800; font-size: 46px; background: var(--main); color: #fff; padding: 12px 24px; border-radius: 14px; z-index: 5; }
      .cap { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1040px; display: flex; justify-content: center; z-index: 6; }
      .cap p { background: rgba(255,255,255,.96); color: var(--ink); font-weight: 800; font-size: 74px; line-height: 1.2; letter-spacing: -0.03em; text-align: center; padding: 22px 34px; border-radius: 22px; box-shadow: 0 10px 30px rgba(60,30,10,.18); }

      /* 진행 막대 (장식, 아래 35% 영역) */
      #prog { position: absolute; left: 120px; width: 770px; top: 1660px; display: flex; gap: 14px; z-index: 4; }
      #prog div { flex: 1; height: 12px; border-radius: 6px; background: rgba(107,62,38,.15); overflow: hidden; }
      #prog div i { display: block; height: 100%; background: var(--main); transform-origin: 0 50%; }

      /* 1+1 */
      #s4-big { position: absolute; left: 120px; width: 770px; top: 600px; text-align: center; font-weight: 900; font-size: 230px; color: var(--main); letter-spacing: -0.05em; line-height: 1; z-index: 5; -webkit-text-stroke: 16px #fff; paint-order: stroke fill; }
      .cap small { display: block; font-size: 36px; font-weight: 700; color: var(--main); margin-top: 8px; }
      #s4-note { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1200px; text-align: center; font-weight: 700; font-size: 36px; color: var(--main); z-index: 6; }

      /* 가격 */
      #s5 { background: var(--main); }
      #s5-kicker { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 330px; text-align: center; font-weight: 800; font-size: 60px; color: #fff; }
      #s5-count { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 420px; display: flex; justify-content: center; align-items: baseline; color: var(--accent); font-weight: 900; letter-spacing: -0.05em; }
      #s5-count b { font-size: 230px; font-variant-numeric: tabular-nums; line-height: 1; }
      #s5-count span { font-size: 110px; margin-left: 8px; }
      #s5-chips { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 760px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #s5-chips span { font-weight: 800; font-size: 54px; color: #fff; background: rgba(255,255,255,.12); padding: 14px 30px; border-radius: 16px; border: 2px solid rgba(233,180,76,.55); }
      #s5-cta { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1110px; display: flex; justify-content: center; }
      #s5-cta p { background: var(--accent); color: var(--ink); font-weight: 900; font-size: 62px; padding: 20px 38px; border-radius: 60px; }
      #s5-basket { position: absolute; left: 140px; width: 800px; top: 1300px; }
      #s5-basket img { width: 100%; border-radius: 26px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1080" data-height="1920">

      <!-- S0 훅 0~3.2초 -->
      <div id="s0" class="clip scene" data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" style="z-index:1">
        <div id="s0-art"><img id="s0-img" src="assets/photo/hook.jpg" alt="" /></div>
        <div id="s0-scrim"></div>
        <div id="s0-tag">[가게 이름] · [꼬리표]</div>
        <div id="s0-lines">
          <div><span class="w">[훅</span> <span class="w gold">숫자,]</span></div>
          <div><span class="w">[훅</span> <span class="w">둘째 줄]</span></div>
          <div><span class="w hl" id="s0-hl">[상품 이름]</span></div>
        </div>
      </div>

      <!-- S1 속재료 3.0~7.0초 -->
      <div id="s1" class="clip scene" data-start="3" data-duration="4" data-track-index="2" data-track-kind="graphics" style="z-index:2">
        <div class="art" id="s1-art"><img id="s1-img" src="assets/photo/1.jpg" alt="" /></div>
        <div class="chip" id="s1-chip">[꼬리표]</div>
        <div class="cap" id="s1-cap"><p>[자막 첫 줄]<br /><span class="hl" id="s1-hl">[강조]</span> [나머지]</p></div>
      </div>

      <!-- S2 11:00 6.8~10.6초 -->
      <div id="s2" class="clip scene" data-start="6.8" data-duration="3.8" data-track-index="3" data-track-kind="graphics" style="z-index:3">
        <div class="art" id="s2-art"><img id="s2-img" src="assets/photo/2.jpg" alt="" /></div>
        <div class="time" id="s2-time"><b>[11:00]</b><i>[할 일]</i></div>
        <div class="cap" id="s2-cap"><p>[자막] <span class="hl" id="s2-hl">[강조]</span></p></div>
      </div>

      <!-- S3 15:00 10.4~14.2초 -->
      <div id="s3" class="clip scene" data-start="10.4" data-duration="3.8" data-track-index="4" data-track-kind="graphics" style="z-index:4">
        <div class="art" id="s3-art"><img id="s3-img" src="assets/photo/3.jpg" alt="" /></div>
        <div class="time" id="s3-time"><b>[15:00]</b><i>[할 일]</i></div>
        <div class="cap" id="s3-cap"><p>[자막] <span class="hl" id="s3-hl">[강조]</span></p></div>
      </div>

      <!-- S4 1+1 14.0~17.8초 -->
      <div id="s4" class="clip scene" data-start="14" data-duration="3.8" data-track-index="5" data-track-kind="graphics" style="z-index:5">
        <div class="art" id="s4-art"><img id="s4-img" src="assets/photo/4.jpg" alt="" /></div>
        <div id="s4-big">[혜택]</div>
        <div class="cap" id="s4-cap"><p>[기간]<br /><span class="hl" id="s4-hl">[혜택 한 줄]</span><small>[조건: 1인 1회 등]</small></p></div>
      </div>

      <!-- 고정 제목 3.0~17.8초 -->
      <div id="fixed" class="clip" data-start="3" data-duration="14.8" data-track-index="7" data-track-kind="graphics" style="z-index:20">
        <span id="fixed-1">[고정 제목 1줄]</span>
        <span id="fixed-2">[고정 제목 2줄]</span>
      </div>

      <!-- 진행 막대(장식) -->
      <div id="prog" class="clip" data-start="3" data-duration="14.8" data-track-index="8" data-track-kind="graphics" data-layout-ignore style="z-index:21">
        <div><i id="pg1"></i></div><div><i id="pg2"></i></div><div><i id="pg3"></i></div><div><i id="pg4"></i></div>
      </div>

      <!-- S5 가격·마무리 17.6~21.5초 -->
      <div id="s5" class="clip scene" data-start="17.6" data-duration="4.9" data-track-index="6" data-track-kind="graphics" style="z-index:30">
        <div id="s5-kicker">[상품 이름 1개]</div>
        <div id="s5-count"><b id="s5-num">[4,800]</b><span>원</span></div>
        <div id="s5-chips">
          <span id="s5-c1">[기간]</span>
          <span id="s5-c2">[시간 · 수량]</span>
        </div>
        <div id="s5-cta"><p id="s5-ctap">[가게 이름] · [예약 방법]</p></div>
        <div id="s5-basket" data-layout-ignore><img src="assets/photo/end.jpg" alt="" /></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // S0 훅: 단어가 하나씩 밀려 들어옴(kinetic-center-build 방식) + 바탕 천천히 확대
      tl.fromTo("#s0-img", { scale: 1.12 }, { scale: 1.0, duration: 3.2, ease: "none" }, 0);
      tl.fromTo("#s0-tag", { y: -10 }, { y: 0, duration: 0.3, ease: E }, 0);
      const words = gsap.utils.toArray("#s0-lines .w");
      // 0프레임(썸네일)에 훅 전체가 보이게: 글자는 처음부터 있고 단어마다 차례로 튕김(kinetic), 강조 밑줄은 0.8초에 그어짐
      words.forEach((w, i) => {
        if (i < 2) tl.fromTo(w, { y: 14 }, { y: 0, duration: 0.3, ease: "back.out(2)" }, 0);
        else tl.fromTo(w, { y: 26, scale: 0.94 }, { y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.12 + (i - 2) * 0.1);
      });
      tl.fromTo("#s0-hl", { "--hl": 0 }, { "--hl": 1, duration: 0.4, ease: "power2.inOut" }, 0.8);
      tl.to("#s0-lines", { y: -30, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.95);

      // 장면 공통: 그림 밀려 들어옴(page-slide) → 천천히 확대 → 밀려 나감
      function routine(id, start, dur, opts = {}) {
        const s = start;
        tl.fromTo(`#${id}-art`, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: E }, s);
        tl.fromTo(`#${id}-img`, { scale: opts.zoomOut ? 1.14 : 1.0 }, { scale: opts.zoomOut ? 1.0 : 1.14, duration: dur, ease: "none" }, s);
        tl.fromTo(`#${id}-cap`, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, s + 0.25);
        tl.fromTo(`#${id}-hl`, { "--hl": 0 }, { "--hl": 1, duration: 0.35, ease: "power2.inOut" }, s + 0.7);
        tl.to([`#${id}-art`, `#${id}-cap`], { x: -140, opacity: 0, duration: 0.3, ease: "power2.in" }, s + dur - 0.3);
      }
      routine("s1", 3, 4);
      routine("s2", 6.8, 3.8, { zoomOut: true });
      routine("s3", 10.4, 3.8);
      routine("s4", 14, 3.8, { zoomOut: true });

      tl.fromTo("#s1-chip", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.15);
      tl.to("#s1-chip", { opacity: 0, duration: 0.2 }, 6.7);
      // 시각: 숫자가 위에서 떨어지며 착지
      [["s2", 6.8], ["s3", 10.4]].forEach(([id, s]) => {
        tl.fromTo(`#${id}-time b`, { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, s + 0.15);
        tl.fromTo(`#${id}-time i`, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: E }, s + 0.4);
        tl.to(`#${id}-time`, { opacity: 0, duration: 0.2 }, s + 3.5);
      });
      // 1+1 spring-pop
      tl.fromTo("#s4-big", { scale: 0.4, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2.6)" }, 14.2);
      tl.to("#s4-big", { opacity: 0, duration: 0.25 }, 17.5);

      // 고정 제목
      tl.fromTo("#fixed-1", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, 3.0);
      tl.fromTo("#fixed-2", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, 3.12);
      // 진행 막대
      [["#pg1", 3, 4], ["#pg2", 6.8, 3.8], ["#pg3", 10.4, 3.8], ["#pg4", 14, 3.8]].forEach(([el, s, d]) => {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: d - 0.2, ease: "none" }, s);
      });

      // S5 가격
      tl.fromTo("#s5", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 17.6);
      tl.fromTo("#s5-kicker", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, 17.7);
      tl.fromTo("#s5-c1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: E }, 18.9);
      tl.fromTo("#s5-c2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: E }, 19.1);
      tl.fromTo("#s5-ctap", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 19.5);
      tl.fromTo("#s5-basket", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: E }, 18.0);

      // 가격 카운트업 (registry count-up 방식: 값은 시간의 함수, 감속 착지 + 한 번 맥박)
      const cnt = { v: 0 };
      const num = document.getElementById("s5-num");
      tl.fromTo(cnt, { v: 0 }, { v: 4800 /* [가격 숫자] */, duration: 1.1, ease: "power3.out", onUpdate: () => { num.textContent = (Math.round(cnt.v / 100) * 100).toLocaleString("en-US"); } }, 17.8);
      tl.fromTo("#s5-count", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: E }, 17.75);
      tl.fromTo("#s5-count", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power1.out", immediateRender: false }, 18.9);
      tl.to("#s5-count", { scale: 1, duration: 0.15, ease: "power1.in" }, 19.02);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
