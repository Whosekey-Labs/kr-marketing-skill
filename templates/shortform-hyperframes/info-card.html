<!doctype html>
<!-- kr-marketing-skill 숏폼 템플릿: 정보 카드(T4). 훅 → 번호 카드 4장(그림 또는 큰 숫자) → 저장용 요약·행동 (HyperFrames). guides/make/shortform-hyperframes.md 참고.
     [대괄호]는 사장님 자료로 채운다. 없으면 장면을 빼고 시간을 당긴다(지어내지 않음). 그림은 assets/art/, 사진은 assets/photo/. -->

<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 600; src: url("assets/fonts/Pretendard-SemiBold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.otf"); }
      :root {
        --deep: #14283e;
        --navy: #24476b;
        --accent: #e0a100;
        --light: #f3f2ef;
        --ink: #0a0a0b;
        --font: "Pretendard", sans-serif;
        /* 안전 영역: y 288~1248, x 120~890 (릴스·쇼츠·틱톡 공통으로 좁게) */
        --safe-l: 120px;
        --safe-w: 770px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--deep); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: #fff; background: var(--deep); overflow: hidden; }
      #grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px); background-size: 90px 90px; }
      .scene { position: absolute; inset: 0; }
      .y { color: var(--accent); }
      .hl { position: relative; z-index: 0; isolation: isolate; white-space: nowrap; }
      .hl::before { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0.02em; height: 0.40em; background: rgba(224,161,0,.45); z-index: -1; transform-origin: 0 50%; transform: scaleX(var(--hl, 1)); }

      /* 훅 */
      #h-tag { position: absolute; left: var(--safe-l); top: 300px; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 40px; padding: 10px 22px; border-radius: 40px; }
      #h-lines { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 392px; font-weight: 900; font-size: 112px; line-height: 1.16; letter-spacing: -0.04em; }
      .w { display: inline-block; }
      #h-art { position: absolute; left: 140px; width: 800px; top: 900px; }
      #h-art img { width: 100%; }

      /* 고정 제목 */
      #fixed { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 296px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 20; }
      #fixed span { display: inline-block; font-weight: 800; font-size: 58px; line-height: 1; padding: 14px 22px; letter-spacing: -0.03em; color: var(--ink); }
      #fixed-1 { background: #fff; }
      #fixed-2 { background: var(--accent); }

      /* 정보 카드 */
      .card { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 516px; height: 540px; background: var(--light); border-radius: 36px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
      .card img { position: absolute; left: 50%; top: 58%; width: 86%; height: 74%; object-fit: contain; }
      .card .num { position: absolute; left: 28px; top: 26px; width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--ink); font-weight: 900; font-size: 50px; display: flex; align-items: center; justify-content: center; z-index: 2; }
      .card .lab { position: absolute; left: 128px; top: 38px; font-weight: 900; font-size: 52px; color: var(--deep); letter-spacing: -0.03em; z-index: 2; }
      .cap { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1080px; text-align: center; font-weight: 800; font-size: 70px; line-height: 1.24; letter-spacing: -0.035em; text-shadow: 0 4px 18px rgba(0,0,0,.4); }

      /* 5번 카드 */
      #s2-big { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: var(--deep); font-weight: 900; line-height: 1; letter-spacing: -0.05em; }
      #s2-big b { font-size: 290px; color: var(--accent); font-variant-numeric: tabular-nums; }
      #s2-big span { font-size: 120px; }
      #s2-sub { position: absolute; left: 0; right: 0; top: 460px; text-align: center; color: var(--navy); font-weight: 800; font-size: 40px; }

      /* 진행 점 (장식) */
      #prog { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1330px; display: flex; gap: 14px; }
      #prog div { flex: 1; height: 12px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
      #prog div i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; }

      /* 마무리 */
      #e-head { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 310px; font-weight: 900; font-size: 76px; letter-spacing: -0.04em; line-height: 1.15; }
      #e-list { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 520px; display: flex; flex-direction: column; gap: 18px; }
      #e-list div { display: flex; align-items: center; gap: 22px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.12); border-radius: 22px; padding: 22px 26px; font-weight: 800; font-size: 50px; letter-spacing: -0.03em; }
      #e-list div i { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 14px; background: var(--accent); color: var(--ink); font-style: normal; font-weight: 900; font-size: 40px; display: flex; align-items: center; justify-content: center; }
      #e-cta { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1060px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #e-cta p { background: #fee500; color: var(--ink); font-weight: 900; font-size: 60px; padding: 20px 40px; border-radius: 60px; }
      #e-cta small { font-weight: 800; font-size: 44px; color: #fff; opacity: .9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23" data-width="1080" data-height="1920">
      <div id="grid"></div>

      <!-- 훅 0~3.2 -->
      <div id="hook" class="clip scene" data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" style="z-index:1">
        <div id="h-tag">[가게 이름] · [꼬리표]</div>
        <div id="h-lines">
          <div><span class="w">[훅</span> <span class="w">첫 줄,]</span></div>
          <div><span class="w y">[강조</span> <span class="w y">둘째 줄]</span></div>
          <div><span class="w hl" id="h-hl">[셋째 줄]</span></div>
        </div>
        <div id="h-art"><img id="h-img" src="assets/art/hook.png" alt="" /></div>
      </div>

      <!-- ① 조사 3.0~6.8 -->
      <div id="s1" class="clip scene" data-start="3" data-duration="3.8" data-track-index="2" data-track-kind="graphics" style="z-index:2">
        <div class="card" id="s1-card"><div class="num">1</div><div class="lab">[항목 1 이름]</div><img id="s1-img" src="assets/art/1.png" alt="" /></div>
        <div class="cap" id="s1-cap">[사장님이 얻는 것 1]<br /><span class="y">[강조]</span></div>
      </div>

      <!-- ② 질문 5번 6.6~10.4 -->
      <div id="s2" class="clip scene" data-start="6.6" data-duration="3.8" data-track-index="3" data-track-kind="graphics" style="z-index:3">
        <div class="card" id="s2-card"><div class="num">2</div><div class="lab">[항목 2 이름]</div>
          <div id="s2-big"><b id="s2-num">[5]</b><span>[단위]</span></div>
          <div id="s2-sub">[숫자 설명]</div>
        </div>
        <div class="cap" id="s2-cap">[자막] <span class="y">[강조]</span><br />[둘째 줄]</div>
      </div>

      <!-- ③ 광고 규칙 10.2~14.0 -->
      <div id="s3" class="clip scene" data-start="10.2" data-duration="3.8" data-track-index="4" data-track-kind="graphics" style="z-index:4">
        <div class="card" id="s3-card"><div class="num">3</div><div class="lab">[항목 3 이름]</div><img id="s3-img" src="assets/art/3.png" alt="" /></div>
        <div class="cap" id="s3-cap">[자막]<br /><span class="y">[강조]</span></div>
      </div>

      <!-- ④ 계정 13.8~17.6 -->
      <div id="s4" class="clip scene" data-start="13.8" data-duration="3.8" data-track-index="5" data-track-kind="graphics" style="z-index:5">
        <div class="card" id="s4-card"><div class="num">4</div><div class="lab">[항목 4 이름]</div><img id="s4-img" src="assets/art/4.png" alt="" /></div>
        <div class="cap" id="s4-cap">[자막]<br /><span class="y">[강조]</span></div>
      </div>

      <!-- 고정 제목 3.0~17.6 -->
      <div id="fixed" class="clip" data-start="3" data-duration="14.6" data-track-index="7" data-track-kind="graphics" style="z-index:20">
        <span id="fixed-1">[고정 제목 1줄]</span>
        <span id="fixed-2">[고정 제목 2줄]</span>
      </div>
      <div id="prog" class="clip" data-start="3" data-duration="14.6" data-track-index="8" data-track-kind="graphics" data-layout-ignore style="z-index:21">
        <div><i id="pg1"></i></div><div><i id="pg2"></i></div><div><i id="pg3"></i></div><div><i id="pg4"></i></div>
      </div>

      <!-- 마무리 17.4~23 -->
      <div id="end" class="clip scene" data-start="17.4" data-duration="5.6" data-track-index="6" data-track-kind="graphics" style="z-index:30">
        <div id="e-head">저장해 두세요</div>
        <div id="e-list">
          <div id="e1"><i>✓</i>[요약 1]</div>
          <div id="e2"><i>✓</i>[요약 2]</div>
          <div id="e3"><i>✓</i>[요약 3]</div>
          <div id="e4"><i>✓</i>[요약 4]</div>
        </div>
        <div id="e-cta"><p id="e-ctap">[행동 한 가지]</p><small id="e-brand">[가게 이름]</small></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // 훅: 첫 줄은 0프레임부터 보임, 나머지 단어는 밀려 들어옴(kinetic-center-build 방식)
      gsap.utils.toArray("#h-lines .w").forEach((w, i) => {
        if (i < 2) tl.fromTo(w, { y: 14 }, { y: 0, duration: 0.3, ease: "back.out(2)" }, 0);
        else tl.fromTo(w, { y: 26, scale: 0.94 }, { y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.12 + (i - 2) * 0.1);
      });
      tl.fromTo("#h-hl", { "--hl": 0 }, { "--hl": 1, duration: 0.4, ease: "power2.inOut" }, 0.85);
      tl.fromTo("#h-img", { y: 60, scale: 0.94 }, { y: 0, scale: 1.02, duration: 3.2, ease: "power1.out" }, 0);
      tl.to(["#h-lines", "#h-tag", "#h-art"], { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 2.95);

      // 정보 카드: 카드가 아래에서 튀어 오름(spring-pop) → 그림 천천히 확대 → 왼쪽으로 밀려 나감(page-slide)
      function card(id, s, d) {
        tl.fromTo(`#${id}-card`, { y: 120, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, s);
        tl.fromTo(`#${id}-card .num`, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, s + 0.25);
        tl.fromTo(`#${id}-cap`, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, s + 0.35);
        tl.to([`#${id}-card`, `#${id}-cap`], { x: -160, opacity: 0, duration: 0.3, ease: "power2.in" }, s + d - 0.3);
      }
      card("s1", 3, 3.8); card("s2", 6.6, 3.8); card("s3", 10.2, 3.8); card("s4", 13.8, 3.8);
      ["s1", "s3", "s4"].forEach((id, k) => {
        const s = [3, 10.2, 13.8][k];
        tl.fromTo(`#${id}-img`, { scale: 0.96, xPercent: -50, yPercent: -50 }, { scale: 1.06, xPercent: -50, yPercent: -50, duration: 3.8, ease: "none" }, s);
      });
      // 5번 카운트다운 (count-up 방식: 값은 시간의 함수)
      const c = { v: 0 }; const n = document.getElementById("s2-num");
      tl.fromTo(c, { v: 0 }, { v: 5 /* [숫자] */, duration: 0.9, ease: "power3.out", onUpdate: () => { n.textContent = Math.round(c.v); } }, 6.9);
      tl.fromTo("#s2-big", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power1.out", immediateRender: false }, 7.8);
      tl.to("#s2-big", { scale: 1, duration: 0.15, ease: "power1.in" }, 7.92);

      tl.fromTo("#fixed-1", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, 3.0);
      tl.fromTo("#fixed-2", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, 3.12);
      [["#pg1", 3], ["#pg2", 6.6], ["#pg3", 10.2], ["#pg4", 13.8]].forEach(([el, s]) => {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 3.6, ease: "none" }, s);
      });

      // 마무리: 체크 줄이 차례로 튀어 오름
      tl.fromTo("#e-head", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: E }, 17.5);
      ["#e1", "#e2", "#e3", "#e4"].forEach((el, i) => {
        tl.fromTo(el, { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 17.75 + i * 0.22);
        tl.fromTo(`${el} i`, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 17.9 + i * 0.22);
      });
      tl.fromTo("#e-ctap", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 18.9);
      tl.fromTo("#e-brand", { opacity: 0 }, { opacity: 0.9, duration: 0.3 }, 19.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
