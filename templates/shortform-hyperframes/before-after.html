<!doctype html>
<!-- kr-marketing-skill 숏폼 템플릿: 전후(T1). 전 사진 위로 후 사진이 닦이듯 드러남(registry before-after-wipe 방식).
     [대괄호]는 사장님 자료로 채운다. assets/photo/before.jpg · after.jpg 는 같은 각도.
     의료는 기본 '권하지 않음', 피부·필라테스는 쓰지 않음, AI 생성·보정 사진 금지 (guides/make/shortform-scenes.md T1). -->
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.otf"); }
      @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.otf"); }
      :root { --main: #24476b; --accent: #e0a100; --ink: #0a0a0b; --safe-l: 120px; --safe-w: 770px; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Pretendard", sans-serif; background: #111; overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #after-wrap { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--cut, 100%)); }
      #line { position: absolute; top: 0; bottom: 0; width: 8px; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.5); left: 0; }
      .lab { position: absolute; top: 520px; font-weight: 900; font-size: 64px; padding: 10px 26px; border-radius: 14px; }
      #lab-b { left: var(--safe-l); background: #fff; color: var(--ink); }
      #lab-a { left: 700px; background: var(--accent); color: var(--ink); }
      #hook { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 300px; text-align: center; color: #fff; font-weight: 900; font-size: 92px; line-height: 1.15; letter-spacing: -0.04em; -webkit-text-stroke: 9px rgba(0,0,0,.8); paint-order: stroke fill; }
      #hook em { font-style: normal; color: var(--accent); }
      .cap { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 1090px; text-align: center; color: #fff; font-weight: 900; font-size: 72px; line-height: 1.2; -webkit-text-stroke: 9px rgba(0,0,0,.85); paint-order: stroke fill; }
      #end { background: var(--main); }
      #e-info { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 480px; text-align: center; color: #fff; font-weight: 900; font-size: 84px; line-height: 1.25; }
      #e-act { position: absolute; left: var(--safe-l); width: var(--safe-w); top: 900px; display: flex; justify-content: center; }
      #e-act p { background: var(--accent); color: var(--ink); font-weight: 900; font-size: 58px; padding: 20px 40px; border-radius: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="ba" class="clip scene" data-start="0" data-duration="10.2" data-track-index="1" data-track-kind="graphics" style="z-index:1">
        <img id="ph-b" class="ph" src="assets/photo/before.jpg" alt="" />
        <div id="after-wrap"><img id="ph-a" class="ph" src="assets/photo/after.jpg" alt="" /></div>
        <div id="line"></div>
        <div class="lab" id="lab-b">전</div>
        <div class="lab" id="lab-a">후</div>
        <div id="hook">[대상]<br /><em>[문제 한 줄]</em></div>
        <div class="cap" id="cap-1">[작업 이름]</div>
        <div class="cap" id="cap-2">[결과 한 줄]</div>
      </div>
      <div id="end" class="clip scene" data-start="10" data-duration="4" data-track-index="2" data-track-kind="graphics" style="z-index:5">
        <div id="e-info">[기간·범위]<br />[금액(포함 범위)]</div>
        <div id="e-act"><p id="e-actp">[가게 이름] · [상담 방법]</p></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      // 0~3초: 전 사진 + 훅(0프레임부터 보임)
      tl.fromTo("#ph-b", { scale: 1.0 }, { scale: 1.08, duration: 10.2, ease: "none" }, 0);
      tl.fromTo("#hook", { y: 16 }, { y: 0, duration: 0.3, ease: "back.out(2)" }, 0);
      tl.to("#hook", { opacity: 0, duration: 0.25 }, 2.8);
      tl.fromTo("#lab-b", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.4);
      tl.fromTo("#cap-1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, 3.1);
      tl.to("#cap-1", { opacity: 0, duration: 0.2 }, 5.6);
      // 3.5~5.5초: 오른쪽에서 왼쪽으로 닦아 후 사진 드러냄 (clip-path + 선)
      tl.fromTo("#after-wrap", { "--cut": "100%" }, { "--cut": "0%", duration: 2.0, ease: "power2.inOut" }, 3.5);
      tl.fromTo("#line", { x: 1080 }, { x: -8, duration: 2.0, ease: "power2.inOut" }, 3.5);
      tl.fromTo("#lab-a", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 5.4);
      tl.to("#lab-b", { opacity: 0, duration: 0.2 }, 5.3);
      tl.fromTo("#cap-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, 5.8);
      tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10);
      tl.fromTo("#e-actp", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 10.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
